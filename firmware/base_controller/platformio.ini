; deskarm base controller: ESP32-S3 USB <-> CAN bridge (SLCAN) + E-stop monitor.
; Optional second route: the Arduino IDE is the main one (see README.md). PlatformIO builds the same
; src/ folder:  pio run -t upload   (plug into the board's "USB" port)

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; Native USB as a CDC serial port (shows up as a COM port on Windows, /dev/ttyACM0 on Linux).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
