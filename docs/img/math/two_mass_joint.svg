<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" width="680" height="190">
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="40" y="60" width="130" height="70" rx="6" fill="#ddf4ff" stroke="#1f6feb" stroke-width="2"/>
<rect x="470" y="60" width="170" height="70" rx="6" fill="#fff1e5" stroke="#d9730d" stroke-width="2"/>
<text x="105.0" y="90.0" font-size="13" fill="#24292f" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="600">motor side</text>
<text x="105.0" y="110.0" font-size="12" fill="#6e7781" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">rotor inertia x ratio^2</text>
<text x="555.0" y="90.0" font-size="13" fill="#24292f" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="600">link side</text>
<text x="555.0" y="110.0" font-size="12" fill="#6e7781" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">arm inertia + gravity load</text>
<polyline points="170.0,95.0 200.0,95.0 205.0,80.0 217.0,110.0 229.0,80.0 241.0,110.0 253.0,80.0 265.0,110.0 277.0,80.0 289.0,110.0 301.0,80.0 313.0,110.0 325.0,80.0 337.0,110.0 349.0,80.0 361.0,110.0 375.0,95.0 400.0,95.0" fill="none" stroke="#2da44e" stroke-width="2.2" stroke-linejoin="round" opacity="1.0"/>
<line x1="400.0" y1="75.0" x2="400.0" y2="115.0" stroke="#2da44e" stroke-width="2.5" stroke-linecap="butt" opacity="1.0"/>
<line x1="430.0" y1="75.0" x2="430.0" y2="115.0" stroke="#d9730d" stroke-width="2.5" stroke-linecap="butt" opacity="1.0"/>
<line x1="430.0" y1="95.0" x2="470.0" y2="95.0" stroke="#d9730d" stroke-width="2.5" stroke-linecap="butt" opacity="1.0"/>
<text x="285.0" y="68.0" font-size="12.5" fill="#2da44e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">gear stiffness k (N m / rad)</text>
<text x="415.0" y="140.0" font-size="12.5" fill="#24292f" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">gap = backlash b</text>
<line x1="60.0" y1="40.0" x2="150.0" y2="40.0" stroke="#1f6feb" stroke-width="2" stroke-linecap="butt" opacity="1.0"/>
<polygon points="150.0,40.0 141.7,36.5 141.7,43.5" fill="#1f6feb"/>
<text x="105.0" y="30.0" font-size="12" fill="#1f6feb" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">servo torque (limited)</text>
<text x="40.0" y="170.0" font-size="12.5" fill="#24292f" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">read_motor() measures the left block, read() the right one. Their difference is tau / k + b / 2.</text>
