<text x="281.1" y="212.5" font-size="12" fill="#1f6feb" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif">elbow one way (q4 &gt; 0)</text>
<line x1="192.5" y1="381.5" x2="388.4" y2="422.7" stroke="#d9730d" stroke-width="5" stroke-linecap="round" opacity="1.0"/>
