<circle cx="388.4" cy="422.7" r="6" stroke="#d9730d" stroke-width="2.5" fill="#ffffff" opacity="1.0"/>
<text x="400.4" y="426.7" font-size="12" fill="#d9730d" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">elbow the other way (q4 &lt; 0)</text>
<line x1="192.5" y1="381.5" x2="476.9" y2="255.1" stroke="#6e7781" stroke-width="1.5" stroke-linecap="butt" opacity="1.0" stroke-dasharray="6 4"/>
