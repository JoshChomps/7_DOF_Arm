<circle cx="476.9" cy="255.1" r="5" stroke="#cf222e" stroke-width="1.5" fill="#cf222e" opacity="1.0"/>
<text x="182.5" y="399.5" font-size="12" fill="#24292f" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif">S (shoulder)</text>
<text x="486.9" y="259.1" font-size="12" fill="#cf222e" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">W (wrist centre)</text>
<line x1="476.9" y1="381.5" x2="476.9" y2="255.1" stroke="#6e7781" stroke-width="1.2" stroke-linecap="butt" opacity="1.0" stroke-dasharray="3 3"/>
<text x="397.3" y="375.5" font-size="12" fill="#6e7781" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">rho (horizontal distance)</text>
<text x="482.9" y="322.3" font-size="12" fill="#6e7781" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">h</text>
<text x="200.5" y="54.9" font-size="12" fill="#6e7781" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">z (up): q2 is measured from here</text>
<text x="34.5" y="518.4" font-size="12.5" fill="#24292f" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">L1 = 190 mm, L2 = 180 mm.   cos q4 = (rho^2 + h^2 - L1^2 - L2^2) / (2 L1 L2)</text>
