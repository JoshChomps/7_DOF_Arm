# Arm description: the single source of truth for kinematics, limits, masses, drives, URDF and the twin.
# Units: metres, degrees (converted to radians on load), kilograms.
#
# Standard Denavit-Hartenberg convention, one row per joint:
#   T_i = Rz(theta_i + offset) * Tz(d) * Tx(a) * Rx(alpha)
# Zero-offset 7-DOF SRS layout (same structure as a KUKA iiwa). At q = 0 the arm points straight up.
# Link lengths match docs/01_requirements.md (190 / 180 / 70 mm). Limits are placeholders until CAD.
#
# Drive data per joint (deskarm.motor, deskarm.physics, tools/torque_budget.py):
#   hold_torque     motor holding torque from the datasheet, N*m
#   rated_current   datasheet current per phase, A
#   resistance      phase resistance, ohm
#   inductance_mh   phase inductance, mH
#   rotor_inertia   kg*m^2 (datasheet: 82 g*cm^2 = 8.2e-6 kg*m^2)
#   ratio           total reduction, belt pre-stage included, exact from the tooth counts (CanBackend
#                   converts motor encoder counts to joint angles with it, so never round it)
#   efficiency      printed cycloid ~0.70, belt + cycloid ~0.63, 2-stage planetary ~0.72
#   motor_sign      optional, default 1: -1 if positive motor encoder counts turn the joint the negative
#                   way. The MKS Dir setting only applies to the pulse interface (manual V1.0.9 §5.2.7),
#                   so over CAN the sign lives here. A cycloid reverses, a belt or planetary doesn't, and
#                   the motor's mounting and wiring decide the rest: find it on the bench (deskarm.drivers)
#   driver          optional, default "S42D_CAN": the MKS board type (deskarm.drivers checks it)
#   hall_deg, hall_width_deg   optional: a hall switch on the driver's IN_1 input that reads "magnet" while
#                   the joint is within hall_deg +- hall_width_deg/2 (default width 10). D33 puts one on J1 and
#                   J7 to check the saved start angle (docs/16 sec. 3.3, deskarm.startup). Not set yet: the
#                   positions come from the CAD and the widths from the bench
# The joint torque limit is  torque_derate * T_motor(speed) * ratio * efficiency, where T_motor(speed)
# is the voltage-limited stepper envelope: flat at the holding torque up to a corner speed, then
# falling roughly as 1/speed. Motor values are the datasheet numbers of the motors BOUGHT on 8 Oct from
# Spool3D (Canada): LDO-42STH60-2004AC (60 mm) on J1/J3/J4, LDO-42STH40-1684AC (40 mm) on J5/J6 and
# LDO-42STH20-1004ASH (20 mm pancake) on J7 (option B's light wrist, accepted 7 Oct). R, L and rotor
# inertia are Spool3D's listing values, except the 60 mm LDO's 2.0 ohm / 3.3 mH, from LDO's own drawing
# (LDO-42STH60-2004AC Rev A, found 20 Oct; the listing said 2.1 / 4.1). J5/J6 use 0.43 N*m, the
# lower of the two published holding torques (Spool3D 0.45, other sellers 4.4 kgf*cm). J2 is the NEMA23
# LKD57HS76-2804-14 (76 mm, 8 mm D-shaft, also bought from Spool3D on 8 Oct): Spool3D lists 1.1 ohm and
# 3.6 mH; the 1.13 ohm and 480 g*cm^2 rotor are from the same-spec FL57STH76-2804A datasheet. Measure R and
# holding torque on the bench.
#
#   gear_stiffness, backlash_deg: printed-gearbox elasticity (N*m/rad at the output) and total lost
#                 motion. PLACEHOLDERS from published printed drives, replace with test-bench numbers
#                 (docs/08 Phase 1):
#                   - printed cycloids, research prototypes: 320-1470 N*m/rad (U. Twente, Roozing et al.);
#                     hobby builds: backlash 30-60 arcmin (0.5-1 deg) with a tight disc fit, ~150 arcmin
#                     loose, and it grows with wear (How To Mechatronics tests)
#                   - printed single-stage planetary: 243 N*m/rad, 0.59 deg; compound 202 N*m/rad, 2.6 deg
#                     (COMPAct, arXiv 2510.07197). Two stages in series add up.
#                 Gearbox only: compliance of the printed links and bearings is NOT included, so the
#                 real arm will be softer still.
#   jmax_deg      optional jerk limit for S-curve moves (default 8 x amax)
#
# vmax_deg / amax_deg are what the planners use. They are set so the drive can do them with the
# rated payload (check with `python tools/torque_budget.py`); the time-optimal profile and the
# torque guard use the real torque-speed curve on top.

[arm]
name = "deskarm-7"
shoulder_frame = 1   # DH frame whose origin is the shoulder centre (J1/J2/J3 axes meet)
elbow_frame = 3      # DH frame whose origin is the elbow (J4 axis)
wrist_frame = 5      # DH frame whose origin is the wrist centre (J5/J6/J7 axes meet)

[tool]
tcp_offset_z = 0.11  # flange -> tool centre point along the J7 axis: the 3-prong gripper's grip zone
                     # (fingertips 0.123, docs/21 §12; was 0.08 before the gripper was drawn)

[drive]
voltage = 24.0        # supply, V
torque_derate = 0.75  # plan with this fraction of the ideal motor envelope (pull-out margin, iron
                      # losses, a driver current set below the maximum to keep the motors cool)
pole_pairs = 50       # 1.8 deg hybrid stepper

# Counterbalance spring on J2 (zero-length: spring + cable over a pulley at the anchor), sized by
# `python -m deskarm.counterbalance`: the k that minimizes the worst-case J2 static torque over the
# reachable workspace with 0-1 kg at the TCP (16.5 -> 6.9 N*m with the 26 Oct CAD masses, which ask for
# 1503 N/m; kept at 1499 while the spring is deferred, D41; 16.1 -> 6.5 with the 20 Oct masses).
# Only k * a * b matters for the torque (10.3 N*m here); a longer a and b trade spring force for
# travel. The CAD (docs/20) fixes a = 70 mm, b = 98 mm: the lug on link 2 has to stay under link 3,
# which sweeps R <= 97 round J3, and clear the pulley. With the CAD masses that needs 1499 N/m, 219 N
# peak and 118 mm of cable travel (1252 N/m with the old estimates; a = 100, b = 150 needed 574 N/m and
# 125 N; changed 20 Oct, see docs/17).
[counterbalance]
joint = "J2"
anchor_height = 0.07      # a: pulley 70 mm above the J2 axis, on the right tower (J1 turntable)
attach_distance = 0.098   # b: cable lug 98 mm along link 2
stiffness = 1499          # N/m (zero-length). Set 0 to simulate without it. D41: not fitted yet;
                          # set 0 the day the arm runs without the spring
free_length = 0.0

[home]
q_deg = [0, 30, 0, 60, 0, 60, 0]

# ---------------------------------------------------------------------------- masses ---------
# Every lump of mass on the arm: `on` = the joint that carries it (it moves with that joint and
# everything before it; "base" = bolted to the desk), `pos` = its centre of mass in the base frame
# AT THE ZERO POSE (arm straight up, x forward, z up from the base board: shoulder at z = 0.209, elbow
# 0.399, wrist centre 0.579, flange 0.649, TCP 0.729). `radius` (default 0.03 m) only sets the lump's own
# rotational inertia.
#
# FROM THE CAD (20 Oct, docs/20 §9, docs/21 §4): `python tools/cad_masses.py` reads DA_ARM's volumes and
# centres (tools/cad_bodies.json, written in Fusion by `tools/fusion_run.py sweep bodies`) and prints this list.
# Printed parts use the slicer's grams (`tools/slice_parts.py`: 6 walls, 40 % gyroid, PETG HF; stl/da/slice.json),
# shared over each part's bodies by volume; parts not sliced (J1) use 0.90 g/cm3, the sliced housings' median.
# Aluminium plates and pulleys 2.70, belts 1.20. Motors and drivers are catalogue values (LDO 60 mm 0.50 kg, 40 mm
# 0.28, 20 mm pancake 0.127, NEMA23 76 mm 1.10; SERVO42D 0.05, 57D 0.09) on the CAD's motor and driver boxes.
# Bearings, steel pins and fasteners are not drawn: point masses on each module's axis (the script lists them).
# The 3-prong gripper is drawn (DA_G_*, docs/21 §12). Weigh the first printed module to check the slicer.
# Until 20 Oct this list was hand estimates: 7.98 kg in all, 4.39 kg past the shoulder (now 9.77 and 5.53; 9.79 and 5.54 before the
# 26 Oct fillet pass).

